name: Juxu
options:
  bundleIdPrefix: com.hcyue.juxu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/../Core/include/wubi_core.h"
    LIBRARY_SEARCH_PATHS:
      - "$(inherited)"
      - "$(PROJECT_DIR)/build-lib"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-lwubi_core"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PrisWubiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Sources/WubiCoreBridge.swift
      - path: Shared
      - path: HostApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: ../Resources/Dicts
        type: folder
        buildPhase: resources
    info:
      path: HostApp/Info.plist
      properties:
        JuxuSettingsGroup: $(AppIdentifierPrefix)com.hcyue.juxu.settings
        PrisWubiSettingsGroup: $(AppIdentifierPrefix)com.hcyue.priswubi.settings
        CFBundleDisplayName: 句序
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "8"
        CFBundleURLTypes:
          - CFBundleURLName: com.hcyue.juxu
            CFBundleURLSchemes:
              - juxu
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: HostApp/PrisWubiApp.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hcyue.juxu.settings
          - $(AppIdentifierPrefix)com.hcyue.priswubi.settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hcyue.juxu
        PRODUCT_NAME: JuxuApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Rust Wubi Core Staticlib
        script: |
          sh "$PROJECT_DIR/Scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: PrisWubiKeyboard
        embed: true

  PrisWubiKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Sources/WubiCoreBridge.swift
      - path: Shared
      - path: KeyboardExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        JuxuSettingsGroup: $(AppIdentifierPrefix)com.hcyue.juxu.settings
        PrisWubiSettingsGroup: $(AppIdentifierPrefix)com.hcyue.priswubi.settings
        CFBundleDisplayName: 句序
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/PrisWubiKeyboard.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hcyue.juxu.settings
          - $(AppIdentifierPrefix)com.hcyue.priswubi.settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hcyue.juxu.keyboard
        PRODUCT_NAME: JuxuKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build Rust Wubi Core Staticlib
        script: |
          sh "$PROJECT_DIR/Scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false

  PrisWubiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: KeyboardExtension/IOSKeyCanvasAndCallout.swift
      - path: UITests
    dependencies:
      - target: PrisWubiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hcyue.juxu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PrisWubiApp

schemes:
  PrisWubiApp:
    build:
      targets:
        PrisWubiApp: all
        PrisWubiKeyboard: all
    test:
      targets:
        - PrisWubiUITests
    run:
      config: Release
