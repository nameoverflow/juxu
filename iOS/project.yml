name: Juxu
options:
  bundleIdPrefix: im.juxu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    SWIFT_OBJC_BRIDGING_HEADER: "$(PROJECT_DIR)/../Core/include/juxu_core.h"
    LIBRARY_SEARCH_PATHS:
      - "$(inherited)"
      - "$(PROJECT_DIR)/build-lib"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-ljuxu_core"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  JuxuApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Sources/JuxuCoreBridge.swift
      - path: Shared
      - path: HostApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: ../Resources/Dicts
        type: folder
        buildPhase: resources
    info:
      path: HostApp/Info.plist
      properties:
        JuxuSettingsGroup: $(AppIdentifierPrefix)im.juxu.settings
        CFBundleDisplayName: 句序
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "9"
        CFBundleURLTypes:
          - CFBundleURLName: im.juxu.app
            CFBundleURLSchemes:
              - juxu
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: HostApp/JuxuApp.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)im.juxu.settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.juxu.app
        PRODUCT_NAME: JuxuApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Rust Wubi Core Staticlib
        script: |
          sh "$PROJECT_DIR/Scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: JuxuKeyboard
        embed: true

  JuxuKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Sources/JuxuCoreBridge.swift
      - path: Shared
      - path: KeyboardExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        JuxuSettingsGroup: $(AppIdentifierPrefix)im.juxu.settings
        CFBundleDisplayName: 句序
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "9"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/JuxuKeyboard.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)im.juxu.settings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.juxu.app.keyboard
        PRODUCT_NAME: JuxuKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build Rust Wubi Core Staticlib
        script: |
          sh "$PROJECT_DIR/Scripts/build-rust-ios.sh"
        basedOnDependencyAnalysis: false

  JuxuUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: KeyboardExtension/IOSKeyCanvasAndCallout.swift
      - path: UITests
    dependencies:
      - target: JuxuApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.juxu.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JuxuApp

schemes:
  JuxuApp:
    build:
      targets:
        JuxuApp: all
        JuxuKeyboard: all
    test:
      targets:
        - JuxuUITests
    run:
      config: Release
