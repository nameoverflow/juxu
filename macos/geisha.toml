name = "juxu_macos"
version = "0.2.0"
entry = "src/main.gsa"
src_dir = "src"

[deps]
juxu_shared = { path = "../shared" }
juxu_core = { git = "https://github.com/nameoverflow/juxu-core.git", version = "0.1.9" }
objc = { git = "https://github.com/geisha-lang/objc.gsa.git", version = "0.1.0" }

[target.macos]
bundle_id    = "im.juxu.inputmethod.Juxu"
bundle_name  = "Juxu"
version      = "0.2.0"
min_os       = "14.0"
lsui_element = true
info_plist   = "../Resources/Info.plist"
frameworks   = ["Cocoa", "InputMethodKit", "Carbon", "QuartzCore"]
resources    = ["../Resources/zh-Hans.lproj"]
codesign     = "-"
