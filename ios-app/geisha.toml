name = "juxu_ios_app"
version = "0.2.0"
entry = "src/main.gsa"
src_dir = "src"

[deps]
juxu_shared = { path = "../shared" }
juxu_core = { git = "https://github.com/nameoverflow/juxu-core.git", version = "0.1.9" }
objc = { git = "https://github.com/geisha-lang/objc.gsa.git", version = "0.1.0" }

[target.ios]
bundle_id        = "im.juxu.app"
bundle_name      = "Juxu"
version          = "0.2.0"
min_os           = "16.0"
frameworks       = ["UIKit", "Foundation", "QuartzCore", "Security"]
embed_extensions = ["../ios-keyboard/build/JuxuKeyboard.appex"]
codesign         = "-"
