name = "juxu_ios_app"
version = "0.2.0"
entry = "src/main.gsa"
src_dir = "src"

[deps]
juxu_shared = { path = "../shared" }
juxu_core = { git = "https://github.com/nameoverflow/juxu-core.git", version = "0.1.9" }
objc = { git = "https://github.com/geisha-lang/objc.gsa.git", version = "0.1.0" }

[target.ios]
bundle_id        = "im.juxu.app"
bundle_name      = "Juxu"
version          = "0.2.0"
min_os           = "16.0"
info_plist       = "Info.plist"
entitlements     = "JuxuApp.entitlements"
c_sources        = ["csrc/sim_entitlements.c"]
c_flags          = ["-O2"]
frameworks       = ["UIKit", "Foundation", "QuartzCore", "CoreGraphics", "Security", "WebKit"]
resources        = [
    "../Resources/Dicts",
    "../Resources/Icons/AppIcon60x60@2x.png",
    "../Resources/Icons/AppIcon60x60@3x.png",
    "../Resources/Icons/AppIcon76x76@2x~ipad.png",
    "../Resources/Icons/AppIcon83.5x83.5@2x~ipad.png",
]
embed_extensions = ["../ios-keyboard/build/JuxuKeyboard.appex"]
codesign         = "-"
