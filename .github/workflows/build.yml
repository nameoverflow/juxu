name: Build macOS & iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Run Core, macOS & iOS Tests + Build App
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          make test app CODESIGN_IDENTITY="-"
      - name: Generate & Build iOS Host App + Keyboard Extension (Simulator)
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          brew install xcodegen
          cd iOS && xcodegen generate
          xcodebuild -project Juxu.xcodeproj \
            -scheme JuxuApp \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
